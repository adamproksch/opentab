<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Can’t reach this page</title>
<link rel="stylesheet" href="opentab://assets/themes.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--fg);min-height:100vh;display:grid;place-items:center;padding:30px;text-align:center;-webkit-font-smoothing:antialiased}
.card{max-width:420px;display:flex;flex-direction:column;align-items:center}
.card img{width:52px;height:52px;border-radius:14px;margin-bottom:24px;opacity:.85}
h1{font-size:22px;font-weight:650;letter-spacing:-.02em;margin-bottom:8px}
p{color:var(--muted);line-height:1.5;word-break:break-word;font-size:14px}
code{display:inline-block;margin-top:14px;color:var(--muted);font-size:11.5px;opacity:.7}
button{margin-top:24px;height:38px;padding:0 22px;border-radius:var(--r);border:0;background:var(--accent);color:var(--on-accent);font:inherit;font-weight:600;cursor:pointer;transition:filter .15s}
button:hover{filter:brightness(1.1)}
</style></head>
<body data-theme="ink"><div class="card">
<img src="opentab://assets/logo.svg" alt="">
<h1 id="t">Can’t reach this page</h1>
<p id="u"></p>
<code id="c"></code>
<button id="retry">Try again</button>
</div>
<script>
const q=new URLSearchParams(location.search);const url=q.get('url')||'';const d=q.get('desc')||'';
let host='';try{host=new URL(url).host}catch{}
document.getElementById('u').textContent=host?host+' isn’t responding.':'';
document.getElementById('c').textContent=d;
document.getElementById('retry').onclick=()=>{if(url)location.href=url};
if(/NAME_NOT_RESOLVED/.test(d))document.getElementById('t').textContent='Site not found';
if(/INTERNET_DISCONNECTED/.test(d)){document.getElementById('t').textContent='You’re offline';document.getElementById('u').textContent='Check your connection.';}
if(/CERT/.test(d))document.getElementById('t').textContent='Connection isn’t private';
if(window.opentabInternal)opentabInternal.home().then(h=>{if(h){Object.assign(document.body.dataset,{theme:h.theme,corners:h.corners,font:h.font}); {const c=h.custom,r=document.documentElement.style;if(c){r.setProperty('--cbg',c.bg);r.setProperty('--cfg',c.fg);}document.body.style.colorScheme=h.theme==='custom'&&c?(c.dark?'dark':'light'):'';}document.documentElement.style.setProperty('--accent',h.accent);document.documentElement.style.setProperty('--on-accent',h.onAccent)}});
</script></body></html>
