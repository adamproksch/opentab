<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Panel</title>
<link rel="stylesheet" href="opentab://assets/themes.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--panel);color:var(--fg);display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
header{padding:16px 16px 10px;display:flex;flex-direction:column;gap:10px}
h1{font-size:15px;font-weight:600}
input.q{height:34px;border-radius:var(--r);border:1px solid var(--line);background:var(--input);color:var(--fg);font:inherit;font-size:13px;padding:0 12px;outline:0}
input.q:focus{border-color:var(--accent)}
#list{flex:1;overflow:auto;padding:0 8px 12px}
.row{display:flex;align-items:center;gap:10px;padding:8px;border-radius:var(--r);cursor:pointer;text-decoration:none;color:inherit;transition:background .2s var(--ease)}
.row:hover{background:var(--hover)}
.row.on{background:var(--hover)}
.row img,.row .ph{width:16px;height:16px;border-radius:4px;flex:none}
.row .ph{background:var(--line)}
.row .tx{min-width:0;flex:1}
.row .t{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .u{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .x{opacity:0;border:0;background:none;color:var(--muted);font-size:16px;width:22px;height:22px;border-radius:6px;cursor:pointer}
.row:hover .x{opacity:1}.row .x:hover{background:var(--line);color:var(--fg)}
.day{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:12px 8px 4px}
textarea{flex:1;margin:0 16px 16px;border-radius:var(--r);border:1px solid var(--line);background:var(--input);color:var(--fg);font:inherit;font-size:13.5px;line-height:1.55;padding:12px;resize:none;outline:0}
textarea:focus{border-color:var(--accent)}
.saved{font-size:11px;color:var(--muted);font-weight:400}
.empty{color:var(--muted);font-size:13px;padding:24px 8px;text-align:center}
</style></head>
<body data-theme="ink">
<header><h1 id="title"></h1><input class="q" id="q" placeholder="Search" hidden></header>
<div id="list"></div>
<script>
const api = window.opentabInternal;
const name = new URLSearchParams(location.search).get('name');
const $ = (s) => document.querySelector(s);
const TITLES = { bookmarks: 'Bookmarks', history: 'History', tabs: 'Open tabs', notes: 'Notes' };
const host = (u) => { try { return new URL(u).hostname.replace(/^www\./, ''); } catch { return ''; } };
const fav = (u) => (u ? `https://www.google.com/s2/favicons?sz=32&domain=${host(u)}` : '');
let data = null;
$('#title').textContent = TITLES[name] || name;

function row(it, onClick, onClose) {
  const r = document.createElement('div');
  r.className = 'row' + (it.active ? ' on' : '');
  const icon = it.favicon || fav(it.url);
  r.innerHTML = `${icon ? '<img>' : '<span class="ph"></span>'}<div class="tx"><div class="t"></div><div class="u"></div></div>${onClose ? '<button class="x" title="Close">×</button>' : ''}`;
  if (icon) { const img = r.querySelector('img'); img.src = icon; img.onerror = () => img.replaceWith(Object.assign(document.createElement('span'), { className: 'ph' })); }
  r.querySelector('.t').textContent = (it.private ? 'Private · ' : '') + (it.title || it.url || 'New Tab');
  r.querySelector('.u').textContent = host(it.url);
  r.onclick = onClick;
  if (onClose) r.querySelector('.x').onclick = (e) => { e.stopPropagation(); onClose(); };
  return r;
}

function draw() {
  const list = $('#list'); list.innerHTML = '';
  const q = $('#q').value.trim().toLowerCase();
  const items = (data.items || []).filter((x) => !q || (x.title || '').toLowerCase().includes(q) || (x.url || '').toLowerCase().includes(q));
  if (!items.length) { list.innerHTML = `<div class="empty">${q ? 'No matches' : 'Nothing here yet'}</div>`; return; }
  let day = '';
  for (const it of items) {
    if (name === 'history' && it.ts) {
      const d = new Date(it.ts).toLocaleDateString([], { weekday: 'long', month: 'short', day: 'numeric' });
      if (d !== day) { day = d; list.append(Object.assign(document.createElement('div'), { className: 'day', textContent: d })); }
    }
    if (name === 'tabs') list.append(row(it, () => api.activate(it.id), async () => { await api.closeTab(it.id); load(); }));
    else list.append(row(it, () => api.open(it.url)));
  }
}

async function load() {
  data = await api.panel(name);
  if (!data) return;
  Object.assign(document.body.dataset, { theme: data.theme, corners: data.corners, font: data.font }); {const c=data.custom,r=document.documentElement.style;if(c){r.setProperty('--cbg',c.bg);r.setProperty('--cfg',c.fg);}document.body.style.colorScheme=data.theme==='custom'&&c?(c.dark?'dark':'light'):'';}
  document.documentElement.style.setProperty('--accent', data.accent);
  if (name === 'notes') {
    if ($('textarea')) return;
    $('#list').remove();
    const ta = document.createElement('textarea');
    ta.placeholder = 'Write anything. It saves as you type.';
    ta.value = data.text || '';
    document.body.append(ta);
    const saved = Object.assign(document.createElement('span'), { className: 'saved' });
    $('#title').append(' ', saved);
    let t;
    ta.addEventListener('input', () => { clearTimeout(t); saved.textContent = ''; t = setTimeout(async () => { await api.saveNotes(ta.value); saved.textContent = 'Saved'; }, 400); });
    ta.focus();
    return;
  }
  $('#q').hidden = false;
  draw();
}
$('#q').addEventListener('input', () => data && draw());
load();
// keep lists fresh while the panel is showing
setInterval(() => { if (name !== 'notes' && document.visibilityState === 'visible' && document.activeElement !== $('#q')) load(); }, 2500);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && name !== 'notes') load(); });
</script></body></html>
